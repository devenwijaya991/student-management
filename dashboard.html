<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Dashboard</title> 
    <link rel="stylesheet" href="style.css" /> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font
awesome/6.0.0-beta3/css/all.min.css" /> 
    <script type="importmap"> 
        { 
            "imports": { 
                "@supabase/supabase-js": 
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" 
            } 
        } 
    </script> 
</head> 
<body> 
    <!-- Navbar --> 
    <nav class="navbar"> 
        <div class="nav-brand"><i class="fas fa-graduation-cap"></i> Student 
Manager</div> 
        <div class="nav-user"> 
            <span id="userName"></span> 
            <button id="logoutBtn" class="btn-outline"><i class="fas fa-sign-out-alt"></i> 
Logout</button> 
        </div> 
    </nav> 
 
    <!-- Main Container --> 
    <div class="container"> 
        <!-- Stats --> 
        <div class="stats-grid"> 
            <div class="stat-card"> 
                <h3><i class="fas fa-users"></i> Total Students</h3> 
                <div class="stat-number" id="totalStudents">0</div> 
            </div> 
            <div class="stat-card"> 
                <h3><i class="fas fa-star"></i> Average GPA</h3> 
                <div class="stat-number" id="avgGpa">0.00</div> 
            </div> 
            <div class="stat-card"> 
                <h3><i class="fas fa-layer-group"></i> Total Semesters</h3> 
                <div class="stat-number" id="totalSemesters">0</div> 
            </div> 
        </div> 
 
        <!-- Student Table --> 
        <div class="dashboard-header"> 
            <h2><i class="fas fa-table"></i> Student List</h2> 
            <button id="openAddModal" class="btn-primary"><i class="fas fa-plus"></i> 
Add Student</button> 
        </div> 
 
        <div class="table-wrapper"> 
            <table> 
                <thead> 
                    <tr> 
                        <th>Name</th> 
                        <th>NIM</th> 
                        <th>Major</th> 
                        <th>Semester</th> 
                        <th>GPA</th> 
                        <th style="text-align:right;">Actions</th> 
                    </tr> 
                </thead> 
                <tbody id="studentTableBody"> 
                    <!-- Rows loaded by JavaScript --> 
                </tbody> 
            </table> 
        </div> 
    </div> 
 
    <!-- Modal for Add / Edit Student --> 
    <div id="studentModal" class="modal"> 
        <div class="modal-content"> 
            <span class="close" id="closeModalBtn">&times;</span> 
            <h3 id="modalTitle">Add Student</h3> 
            <form id="studentForm"> 
                <input type="hidden" id="studentId" /> 
                <div class="input-group"> 
                    <i class="fas fa-user"></i> 
                    <input type="text" id="studentName" placeholder="Full Name" required /> 
                </div> 
                <div class="input-group"> 
                    <i class="fas fa-id-card"></i> 
                    <input type="text" id="studentNim" placeholder="NIM (e.g. 20241001)" 
required /> 
                </div> 
                <div class="input-group"> 
                    <i class="fas fa-book"></i> 
                    <input type="text" id="studentMajor" placeholder="Major (e.g. Informatics)" 
required /> 
                </div> 
                <div class="input-group"> 
                    <i class="fas fa-layer-group"></i> 
                    <select id="studentSemester" required> 
                        <option value="">Select Semester</option> 
                        <option value="1">1</option> 
                        <option value="2">2</option> 
                        <option value="3">3</option> 
                        <option value="4">4</option> 
                        <option value="5">5</option> 
                        <option value="6">6</option> 
                        <option value="7">7</option> 
                        <option value="8">8</option> 
                    </select> 
                </div> 
                <div class="input-group"> 
                    <i class="fas fa-star"></i> 
                    <input type="number" id="studentGpa" placeholder="GPA (0.00 - 4.00)" 
min="0" max="4" step="0.01" required /> 
                </div> 
                <button type="submit" class="btn-primary" id="formSubmitBtn"><i 
class="fas fa-save"></i> Save</button> 
                <button type="button" class="btn-outline" 
id="cancelModalBtn">Cancel</button> 
            </form> 
        </div> 
    </div> 
 
    <script type="module"> 
        import { createClient } from '@supabase/supabase-js'; 
 
        // === CONFIGURE WITH YOUR SUPABASE KEYS === 
        const SUPABASE_URL = 'https://ndsdcyjmnflpmaqgtpsm.supabase.co'; // CHANGE 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kc2RjeWptbmZscG1hcWd0cHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzYxMDksImV4cCI6MjEwMDg1MjEwOX0.Bj0d9HOmlR7jfKR4-49GwTasxX7Po2bkhxZYh-XzNis';                 // CHANGE THIS 
        // ========================================== 
 
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY); 
 
        // === CHECK SESSION === 
        const { data: { session } } = await supabase.auth.getSession(); 
        if (!session) { 
            window.location.href = 'index.html'; 
        } 
        const user = session.user; 
        document.getElementById('userName').textContent = 
user.user_metadata?.full_name || user.email; 
 
        // === LOGOUT === 
        document.getElementById('logoutBtn').addEventListener('click', async () => { 
            await supabase.auth.signOut(); 
            window.location.href = 'index.html'; 
        }); 
 
        // === DOM REFS === 
        const tableBody = document.getElementById('studentTableBody'); 
        const totalStudentsEl = document.getElementById('totalStudents'); 
        const avgGpaEl = document.getElementById('avgGpa'); 
        const totalSemestersEl = document.getElementById('totalSemesters'); 
 
        const modal = document.getElementById('studentModal'); 
        const modalTitle = document.getElementById('modalTitle'); 
        const form = document.getElementById('studentForm'); 
        const studentId = document.getElementById('studentId'); 
        const studentName = document.getElementById('studentName'); 
        const studentNim = document.getElementById('studentNim'); 
        const studentMajor = document.getElementById('studentMajor'); 
        const studentSemester = document.getElementById('studentSemester'); 
        const studentGpa = document.getElementById('studentGpa'); 
        const formSubmitBtn = document.getElementById('formSubmitBtn'); 
        const closeModalBtn = document.getElementById('closeModalBtn'); 
        const cancelModalBtn = document.getElementById('cancelModalBtn'); 
        const openAddBtn = document.getElementById('openAddModal'); 
 
        let editingId = null; 
 
        // === CRUD FUNCTIONS === 
 
        // Load students 
        async function loadStudents() { 
            const { data, error } = await supabase 
                .from('students') 
                .select('*') 
                .eq('user_id', user.id) 
                .order('created_at', { ascending: false }); 
 
            if (error) { 
                console.error(error); 
                return; 
            } 
 
            // Update stats 
            totalStudentsEl.textContent = data.length; 
            if (data.length === 0) { 
                avgGpaEl.textContent = '0.00'; 
                totalSemestersEl.textContent = '0'; 
                tableBody.innerHTML = `<tr><td colspan="6" class="empty-msg">No 
students found. Add your first student!</td></tr>`; 
                return; 
            } 
 
            const totalGpa = data.reduce((sum, s) => sum + s.gpa, 0); 
            const avgGpa = (totalGpa / data.length).toFixed(2); 
            avgGpaEl.textContent = avgGpa; 
 
            const semesters = new Set(data.map(s => s.semester)); 
            totalSemestersEl.textContent = semesters.size; 
 
            // Render table 
            tableBody.innerHTML = data.map(s => ` 
                <tr> 
                    <td><strong>${s.name}</strong></td> 
                    <td>${s.nim}</td> 
                    <td>${s.major}</td> 
                    <td>Semester ${s.semester}</td> 
                    <td>${s.gpa.toFixed(2)}</td> 
                    <td style="text-align:right;"> 
                        <div class="actions" style="justify-content:flex-end;"> 
                            <button class="btn-edit" data-id="${s.id}"><i class="fas fa-edit"></i> 
Edit</button> 
                            <button class="btn-danger" data-id="${s.id}"><i class="fas fa
trash"></i> Delete</button> 
                        </div> 
                    </td> 
                </tr> 
            `).join(''); 
 
            // Attach edit/delete events 
            document.querySelectorAll('.btn-edit').forEach(btn => { 
                btn.addEventListener('click', () => openEditModal(btn.dataset.id)); 
            }); 
            document.querySelectorAll('.btn-danger').forEach(btn => { 
                btn.addEventListener('click', () => deleteStudent(btn.dataset.id)); 
            }); 
        } 
 
        // Open Add Modal 
        function openAddModalFunc() { 
            editingId = null; 
            modalTitle.textContent = 'Add Student'; 
            formSubmitBtn.innerHTML = '<i class="fas fa-save"></i> Save'; 
            form.reset(); 
            studentId.value = ''; 
            modal.style.display = 'flex'; 
        } 
 
        // Open Edit Modal 
        async function openEditModal(id) { 
            const { data, error } = await supabase 
                .from('students') 
                .select('*') 
                .eq('id', id) 
                .single(); 
 
            if (error) return; 
 
            editingId = id; 
            modalTitle.textContent = 'Edit Student'; 
            formSubmitBtn.innerHTML = '<i class="fas fa-save"></i> Update'; 
            studentId.value = data.id; 
            studentName.value = data.name; 
            studentNim.value = data.nim; 
            studentMajor.value = data.major; 
            studentSemester.value = data.semester; 
            studentGpa.value = data.gpa; 
            modal.style.display = 'flex'; 
        } 
 
        // Close Modal 
        function closeModal() { 
            modal.style.display = 'none'; 
            form.reset(); 
        } 
        closeModalBtn.addEventListener('click', closeModal); 
        cancelModalBtn.addEventListener('click', closeModal); 
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); }); 
        openAddBtn.addEventListener('click', openAddModalFunc); 
 
        // Submit Form (Add / Update) 
        form.addEventListener('submit', async (e) => { 
            e.preventDefault(); 
 
            const name = studentName.value.trim(); 
            const nim = studentNim.value.trim(); 
            const major = studentMajor.value.trim(); 
            const semester = parseInt(studentSemester.value); 
            const gpa = parseFloat(studentGpa.value); 
 
            if (!name || !nim || !major || !semester || isNaN(gpa)) { 
                alert('Please fill all fields correctly.'); 
                return; 
            } 
 
            if (editingId) { 
                // UPDATE 
                const { error } = await supabase 
                    .from('students') 
                    .update({ name, nim, major, semester, gpa }) 
                    .eq('id', editingId); 
                if (error) { 
                    alert('Update failed: ' + error.message); 
                    return; 
                } 
            } else { 
                // CREATE 
                const { error } = await supabase 
                    .from('students') 
                    .insert([{ name, nim, major, semester, gpa, user_id: user.id }]); 
                if (error) { 
                    alert('Insert failed: ' + error.message); 
                    return; 
                } 
            } 
 
            closeModal(); 
            loadStudents(); 
        }); 
 
        // Delete Student 
        async function deleteStudent(id) { 
            if (!confirm('Are you sure you want to delete this student?')) return; 
            const { error } = await supabase 
                .from('students') 
                .delete() 
                .eq('id', id); 
            if (error) { 
                alert('Delete failed: ' + error.message); 
                return; 
            } 
            loadStudents(); 
        } 
 
        // Initial load 
        loadStudents(); 
    </script> 
</body> 
</html>
